<svg viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Seamless switching between applications, slide decks, media files, and camera devices">
  <defs>
    <linearGradient id="swCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="100%" stop-color="#0f1017" />
    </linearGradient>

    <linearGradient id="swActiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241c1f" />
      <stop offset="100%" stop-color="#181318" />
    </linearGradient>

    <filter id="swGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Isometric Grid -->
  <g opacity="0.12">
    <path d="M50 80 H750 M50 180 H750 M50 280 H750 M50 380 H750 M50 480 H750" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 6" />
    <path d="M120 40 V480 M280 40 V480 M440 40 V480 M600 40 V480 M760 40 V480" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 6" />
  </g>

  <!-- Selection Stage Wrapper -->
  <g transform="translate(60, 45)">
    <!-- Stage Label -->
    <rect width="130" height="22" rx="4" fill="rgba(255, 122, 89, 0.1)" stroke="rgba(255, 122, 89, 0.3)" stroke-width="1" />
    <text x="65" y="15" fill="#ff7a59" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">SOURCE SELECTOR</text>

    <!-- Source Row 1: Active Source (PowerPoint Keynote) -->
    <g transform="translate(0, 36)">
      <rect width="320" height="74" rx="8" fill="url(#swActiveGrad)" stroke="#ff7a59" stroke-width="1.6" filter="url(#swGlow)" />
      
      <!-- Glyph Icon Tile -->
      <rect x="12" y="14" width="46" height="46" rx="6" fill="rgba(255, 122, 89, 0.18)" stroke="#ff7a59" stroke-width="1" />
      <text x="35" y="42" font-size="20" text-anchor="middle">📊</text>

      <!-- Source Text -->
      <text x="70" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Quarterly Strategy.pptx</text>
      <text x="70" y="48" fill="#a0a3b6" font-family="monospace" font-size="9">PowerPoint • Slide 4 of 18</text>

      <!-- Live Badge -->
      <rect x="250" y="26" width="56" height="22" rx="4" fill="#ff3b30" />
      <text x="278" y="40" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">LIVE</text>
    </g>

    <!-- Source Row 2: Next Queued Source (Browser Sales App) -->
    <g transform="translate(0, 122)">
      <rect width="320" height="74" rx="8" fill="url(#swCardGrad)" stroke="#3a3e54" stroke-width="1.2" />
      
      <rect x="12" y="14" width="46" height="46" rx="6" fill="#1d202e" stroke="#2c3044" stroke-width="1" />
      <text x="35" y="42" font-size="20" text-anchor="middle">🌐</text>

      <text x="70" y="32" fill="#e2e4ef" font-family="sans-serif" font-size="12" font-weight="600">Sales Analytics Dashboard</text>
      <text x="70" y="48" fill="#7a7d92" font-family="monospace" font-size="9">Google Chrome • 1920 × 1080</text>

      <rect x="250" y="26" width="56" height="22" rx="4" fill="rgba(255, 122, 89, 0.15)" stroke="#ff7a59" stroke-width="0.8" />
      <text x="278" y="40" fill="#ff7a59" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">NEXT</text>
    </g>

    <!-- Source Row 3: Queued Media (Product Video) -->
    <g transform="translate(0, 208)">
      <rect width="320" height="74" rx="8" fill="url(#swCardGrad)" stroke="#272a39" stroke-width="1" />
      
      <rect x="12" y="14" width="46" height="46" rx="6" fill="#1d202e" stroke="#2c3044" stroke-width="1" />
      <text x="35" y="42" font-size="20" text-anchor="middle">🎬</text>

      <text x="70" y="32" fill="#c0c3d4" font-family="sans-serif" font-size="12" font-weight="500">Product Walkthrough.mp4</text>
      <text x="70" y="48" fill="#6c6f82" font-family="monospace" font-size="9">Media File • 03:45 1080p</text>

      <rect x="250" y="26" width="56" height="22" rx="4" fill="#1e202c" stroke="#2b2e3f" stroke-width="0.8" />
      <text x="278" y="40" fill="#8d90a5" font-family="monospace" font-size="9" font-weight="600" text-anchor="middle">QUEUE</text>
    </g>

    <!-- Source Row 4: Camera Device -->
    <g transform="translate(0, 294)">
      <rect width="320" height="74" rx="8" fill="url(#swCardGrad)" stroke="#272a39" stroke-width="1" />
      
      <rect x="12" y="14" width="46" height="46" rx="6" fill="#1d202e" stroke="#2c3044" stroke-width="1" />
      <text x="35" y="42" font-size="20" text-anchor="middle">📷</text>

      <text x="70" y="32" fill="#c0c3d4" font-family="sans-serif" font-size="12" font-weight="500">Conference Room Camera</text>
      <text x="70" y="48" fill="#6c6f82" font-family="monospace" font-size="9">USB Video Device • 60 FPS</text>

      <rect x="250" y="26" width="56" height="22" rx="4" fill="#1e202c" stroke="#2b2e3f" stroke-width="0.8" />
      <text x="278" y="40" fill="#8d90a5" font-family="monospace" font-size="9" font-weight="600" text-anchor="middle">QUEUE</text>
    </g>
  </g>

  <!-- ==================== TRANSITION BRIDGE ==================== -->

  <g transform="translate(400, 160)">
    <!-- Instant Switch Indicator -->
    <rect x="-10" y="0" width="40" height="150" rx="20" fill="rgba(255, 122, 89, 0.05)" stroke="rgba(255, 122, 89, 0.25)" stroke-dasharray="3 3" />
    
    <!-- Transition Flow Line -->
    <path d="M-20 75 L 40 75" stroke="#ff7a59" stroke-width="2" stroke-linecap="round" />
    <polygon points="36,70 46,75 36,80" fill="#ff7a59" />

    <!-- Instant Switch Pill -->
    <g transform="translate(-40, 18)">
      <rect width="100" height="26" rx="13" fill="#14151e" stroke="#ff7a59" stroke-width="1.2" />
      <text x="50" y="16" fill="#ffffff" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">SEAMLESS CUT</text>
    </g>

    <text x="10" y="125" fill="#8d90a5" font-family="monospace" font-size="8" text-anchor="middle">0ms Drop</text>
  </g>

  <!-- ==================== RIGHT: AUDIENCE SEES SMOOTH CUT ==================== -->

  <g transform="translate(470, 75)">
    <!-- Main Display Housing -->
    <rect width="270" height="340" rx="10" fill="#0c0d13" stroke="#2d3042" stroke-width="1.4" />
    
    <!-- Titlebar -->
    <rect width="270" height="28" rx="10" fill="#161822" />
    <rect y="18" width="270" height="10" fill="#161822" />
    <line x1="0" y1="28" x2="270" y2="28" stroke="#262938" stroke-width="1" />
    
    <circle cx="16" cy="14" r="3" fill="#ff7a59" />
    <circle cx="26" cy="14" r="3" fill="#2b2e3f" />
    <circle cx="36" cy="14" r="3" fill="#2b2e3f" />
    <text x="50" y="17" fill="#ffffff" font-family="sans-serif" font-size="8.5" font-weight="700">PRESENTATION OUTPUT</text>

    <!-- Staged Split Transition Simulation -->
    <g transform="translate(16, 42)">
      <!-- Main Content Canvas -->
      <rect width="238" height="210" rx="6" fill="#13151f" stroke="#232634" stroke-width="1" />

      <!-- Active Staged App Content -->
      <g transform="translate(16, 16)">
        <rect width="120" height="14" rx="3" fill="#ffffff" fill-opacity="0.9" />
        <rect y="22" width="160" height="8" rx="2" fill="#7a7d92" />
        
        <!-- Metrics Boxes -->
        <g transform="translate(0, 42)">
          <rect width="64" height="44" rx="4" fill="#1a1c27" stroke="#ff7a59" stroke-width="1" />
          <text x="8" y="18" fill="#ff7a59" font-family="monospace" font-size="7" font-weight="700">REVENUE</text>
          <text x="8" y="34" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">+38%</text>

          <rect x="72" width="64" height="44" rx="4" fill="#1a1c27" stroke="#2b2e3f" stroke-width="1" />
          <text x="80" y="18" fill="#7a7d92" font-family="monospace" font-size="7">RETENTION</text>
          <text x="80" y="34" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">94%</text>

          <rect x="144" width="62" height="44" rx="4" fill="#1a1c27" stroke="#2b2e3f" stroke-width="1" />
          <text x="152" y="18" fill="#7a7d92" font-family="monospace" font-size="7">TEAMS</text>
          <text x="152" y="34" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">12.4k</text>
        </g>

        <!-- Mini Visual Chart -->
        <rect y="98" width="206" height="46" rx="4" fill="#161824" stroke="#232636" stroke-width="0.8" />
        <path d="M12 132 L 50 120 L 90 126 L 130 112 L 170 106 L 196 102" stroke="#ff7a59" stroke-width="2" fill="none" />
        <circle cx="196" cy="102" r="3" fill="#ff7a59" />
      </g>

      <!-- Status Footer Bar -->
      <rect y="182" width="238" height="28" rx="0" fill="#0f1017" />
      <line x1="0" y1="182" x2="238" y2="182" stroke="#232634" stroke-width="0.8" />
      <circle cx="16" cy="196" r="3.5" fill="#34d399" />
      <text x="26" y="199" fill="#34d399" font-family="monospace" font-size="7.5" font-weight="700">ACTIVE SESSION • ZERO GLITCH</text>
    </g>

    <!-- Bottom Feature Callout -->
    <g transform="translate(16, 268)">
      <rect width="238" height="54" rx="6" fill="#151722" stroke="rgba(255, 122, 89, 0.2)" stroke-width="1" />
      <text x="14" y="22" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700">No screen share restarts.</text>
      <text x="14" y="38" fill="#8d90a5" font-family="sans-serif" font-size="8">The audience window remains active and shared.</text>
    </g>
  </g>
</svg>
