<svg viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Direct presentation of PowerPoint decks, media videos, and graphics without changing the shared window">
  <defs>
    <linearGradient id="mediaCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="100%" stop-color="#0f1016" />
    </linearGradient>

    <linearGradient id="mediaScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151722" />
      <stop offset="100%" stop-color="#0a0b10" />
    </linearGradient>

    <filter id="mediaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Technical Background Grid -->
  <g opacity="0.12">
    <path d="M50 70 H750 M50 170 H750 M50 270 H750 M50 370 H750 M50 470 H750" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 6" />
    <path d="M100 30 V470 M250 30 V470 M400 30 V470 M550 30 V470 M700 30 V470" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 6" />
  </g>

  <!-- Left: 3 Media Cards Stacked -->
  <g transform="translate(60, 60)">
    
    <!-- Media 1: PowerPoint PPTX Deck -->
    <g transform="translate(0, 0)">
      <rect width="250" height="96" rx="8" fill="url(#mediaCardGrad)" stroke="#ff7a59" stroke-width="1.4" />
      <!-- Header bar -->
      <rect width="250" height="24" rx="8" fill="#151620" />
      <rect y="16" width="250" height="8" fill="#151620" />
      <text x="14" y="15" fill="#ff7a59" font-family="monospace" font-size="8.5" font-weight="700">POWERPOINT PRESENTATION</text>
      <circle cx="236" cy="12" r="3" fill="#ff7a59" />

      <!-- Content -->
      <g transform="translate(14, 34)">
        <text x="0" y="14" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Roadmap Strategy.pptx</text>
        <text x="0" y="28" fill="#8d90a5" font-family="monospace" font-size="8">Direct Deck / Windowed Mode</text>
        <!-- Slide Stepper Pill -->
        <g transform="translate(0, 36)">
          <rect width="100" height="18" rx="4" fill="#1b1d2a" stroke="#2c3044" stroke-width="0.8" />
          <text x="8" y="12" fill="#ff7a59" font-family="monospace" font-size="8" font-weight="700">‹ SLIDE 4 / 18 ›</text>
        </g>
      </g>
    </g>

    <!-- Media 2: Video Media (MP4) -->
    <g transform="translate(0, 120)">
      <rect width="250" height="96" rx="8" fill="url(#mediaCardGrad)" stroke="#2b2f42" stroke-width="1.2" />
      <rect width="250" height="24" rx="8" fill="#151620" />
      <rect y="16" width="250" height="8" fill="#151620" />
      <text x="14" y="15" fill="#a4a7bc" font-family="monospace" font-size="8.5" font-weight="700">VIDEO MEDIA PLAYBACK</text>
      <circle cx="236" cy="12" r="3" fill="#2b2f42" />

      <g transform="translate(14, 34)">
        <text x="0" y="14" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Product Demo Walkthrough.mp4</text>
        <text x="0" y="28" fill="#8d90a5" font-family="monospace" font-size="8">Hardware D3D Surface • 1080p</text>
        <!-- Scrubber Line -->
        <g transform="translate(0, 38)">
          <rect width="220" height="4" rx="2" fill="#222534" />
          <rect width="90" height="4" rx="2" fill="#ff7a59" />
          <circle cx="90" cy="2" r="4" fill="#ffffff" />
          <text x="175" y="16" fill="#8d90a5" font-family="monospace" font-size="7.5">01:42 / 03:45</text>
        </g>
      </g>
    </g>

    <!-- Media 3: High-Res Image / Infographic -->
    <g transform="translate(0, 240)">
      <rect width="250" height="96" rx="8" fill="url(#mediaCardGrad)" stroke="#2b2f42" stroke-width="1.2" />
      <rect width="250" height="24" rx="8" fill="#151620" />
      <rect y="16" width="250" height="8" fill="#151620" />
      <text x="14" y="15" fill="#a4a7bc" font-family="monospace" font-size="8.5" font-weight="700">GRAPHIC & INFOGRAPHIC</text>
      <circle cx="236" cy="12" r="3" fill="#2b2f42" />

      <g transform="translate(14, 34)">
        <text x="0" y="14" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Quarterly Infographic.png</text>
        <text x="0" y="28" fill="#8d90a5" font-family="monospace" font-size="8">Uniform Fit • Never Stretched</text>
        <g transform="translate(0, 36)">
          <rect width="90" height="18" rx="4" fill="#1b1d2a" stroke="#2c3044" stroke-width="0.8" />
          <text x="8" y="12" fill="#34d399" font-family="monospace" font-size="8" font-weight="700">3840 × 2160 UHD</text>
        </g>
      </g>
    </g>

  </g>

  <!-- Convergence Pathway -->
  <g transform="translate(325, 200)">
    <path d="M0 0 C 40 0, 50 15, 80 15" stroke="#ff7a59" stroke-width="2" fill="none" />
    <polygon points="76,10 86,15 76,20" fill="#ff7a59" />
    <rect x="15" y="-14" width="55" height="18" rx="4" fill="#13151f" stroke="#ff7a59" stroke-width="0.8" />
    <text x="42" y="-2" fill="#ff7a59" font-family="monospace" font-size="7.5" font-weight="700" text-anchor="middle">STREAM</text>
  </g>

  <!-- Right: Audience Presentation Canvas -->
  <g transform="translate(425, 60)">
    <rect width="320" height="340" rx="12" fill="url(#mediaScreenGrad)" stroke="#ff7a59" stroke-width="1.6" filter="url(#mediaGlow)" />
    
    <!-- Titlebar -->
    <rect width="320" height="30" rx="12" fill="#171924" />
    <rect y="20" width="320" height="10" fill="#171924" />
    <line x1="0" y1="30" x2="320" y2="30" stroke="rgba(255, 122, 89, 0.3)" stroke-width="1" />
    
    <circle cx="16" cy="15" r="3.5" fill="#ff7a59" />
    <circle cx="28" cy="15" r="3.5" fill="#2b2f42" />
    <circle cx="40" cy="15" r="3.5" fill="#2b2f42" />
    <text x="56" y="19" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700">OUTPUT CANVAS • PRESENTATION</text>

    <!-- Canvas Body (Video / Presentation Stage) -->
    <g transform="translate(18, 46)">
      <!-- 16:9 Inner Viewport -->
      <rect width="284" height="210" rx="6" fill="#0c0d12" stroke="#222534" stroke-width="1" />
      
      <!-- Video / Slide Artwork Wireframe -->
      <rect x="20" y="24" width="140" height="16" rx="3" fill="#ffffff" />
      <rect x="20" y="46" width="180" height="8" rx="2" fill="#8d90a5" />

      <!-- Center Play / Slide Symbol -->
      <circle cx="142" cy="105" r="28" fill="rgba(255, 122, 89, 0.2)" stroke="#ff7a59" stroke-width="1.5" />
      <polygon points="137,94 153,105 137,116" fill="#ff7a59" />

      <!-- Timeline Transport bar -->
      <g transform="translate(20, 165)">
        <rect width="244" height="6" rx="3" fill="#1e2130" />
        <rect width="130" height="6" rx="3" fill="#ff7a59" />
        <circle cx="130" cy="3" r="5" fill="#ffffff" />
        <text x="0" y="24" fill="#a4a7bc" font-family="monospace" font-size="8">01:42</text>
        <text x="210" y="24" fill="#6d7085" font-family="monospace" font-size="8">03:45</text>
      </g>
    </g>

    <!-- Bottom Feature Tag -->
    <g transform="translate(18, 274)">
      <rect width="284" height="46" rx="6" fill="#14151e" stroke="#2b2f42" stroke-width="1" />
      <text x="14" y="20" fill="#ffffff" font-family="sans-serif" font-size="9.5" font-weight="700">Dedicated Media Rendering</text>
      <text x="14" y="34" fill="#8d90a5" font-family="sans-serif" font-size="8">No third-party media players or browser tabs needed.</text>
    </g>
  </g>
</svg>
