<svg viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Targeting clean presentation output to external conference displays and projectors">
  <defs>
    <linearGradient id="monCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="100%" stop-color="#0f1016" />
    </linearGradient>

    <linearGradient id="projGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d85" />
      <stop offset="100%" stop-color="#ff7a59" />
    </linearGradient>

    <filter id="monGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Technical Background Grid -->
  <g opacity="0.12">
    <path d="M50 70 H750 M50 170 H750 M50 270 H750 M50 370 H750 M50 470 H750" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 6" />
    <path d="M120 30 V470 M280 30 V470 M440 30 V470 M600 30 V470 M760 30 V470" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 6" />
  </g>

  <!-- Display 1: Presenter's Laptop / Control Monitor (Left) -->
  <g transform="translate(60, 90)">
    <!-- Monitor Bezel -->
    <rect width="310" height="230" rx="8" fill="#11121a" stroke="#2b2e40" stroke-width="1.6" />
    <!-- Screen Surface -->
    <rect x="10" y="10" width="290" height="210" rx="4" fill="#0c0d13" />

    <!-- Title / Identity Bar -->
    <rect x="10" y="10" width="290" height="26" fill="#161822" />
    <circle cx="24" cy="23" r="3" fill="#2b2e40" />
    <circle cx="34" cy="23" r="3" fill="#2b2e40" />
    <circle cx="44" cy="23" r="3" fill="#2b2e40" />
    <text x="58" y="26" fill="#a4a7bc" font-family="monospace" font-size="8">DISPLAY 1 • PRESENTER SCREEN</text>

    <!-- SwitchCast Control App Running on Display 1 -->
    <g transform="translate(24, 46)">
      <!-- App Shell -->
      <rect width="262" height="154" rx="6" fill="#141620" stroke="#ff7a59" stroke-width="1" />
      
      <!-- App Header -->
      <rect width="262" height="20" rx="6" fill="#1c1e2a" />
      <rect y="14" width="262" height="6" fill="#1c1e2a" />
      <text x="10" y="14" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="700">SwitchCast v1.5 Control App</text>
      
      <!-- Queue Sidebar -->
      <g transform="translate(8, 28)">
        <rect width="80" height="110" rx="4" fill="#0f1016" />
        <rect x="6" y="8" width="68" height="12" rx="2" fill="#1e2130" />
        <rect x="6" y="26" width="68" height="20" rx="3" fill="#222534" stroke="#ff7a59" stroke-width="0.6" />
        <rect x="6" y="52" width="68" height="20" rx="3" fill="#191b26" />
        <rect x="6" y="78" width="68" height="20" rx="3" fill="#191b26" />
      </g>

      <!-- Main Panel & Target Selection -->
      <g transform="translate(96, 28)">
        <rect width="158" height="110" rx="4" fill="#0f1016" />
        <text x="10" y="20" fill="#ff7a59" font-family="monospace" font-size="7.5" font-weight="700">TARGET OUTPUT ROUTING</text>
        
        <!-- Target Display Option Selected -->
        <g transform="translate(10, 30)">
          <rect width="138" height="34" rx="4" fill="rgba(255, 122, 89, 0.12)" stroke="#ff7a59" stroke-width="1" />
          <text x="8" y="16" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="700">Display 2 (Projector)</text>
          <text x="8" y="26" fill="#8d90a5" font-family="monospace" font-size="6.5">HDMI • 2560 × 1440 @ 60Hz</text>
          <circle cx="124" cy="17" r="4" fill="#34d399" />
        </g>

        <!-- Status Tag -->
        <rect x="10" y="74" width="138" height="24" rx="4" fill="#171924" stroke="#252838" stroke-width="0.6" />
        <text x="18" y="89" fill="#34d399" font-family="monospace" font-size="7.5">● LIVE TO PROJECTOR</text>
      </g>
    </g>

    <!-- Monitor Stand -->
    <rect x="135" y="230" width="40" height="40" fill="#171924" stroke="#2b2e40" stroke-width="1" />
    <rect x="105" y="270" width="100" height="12" rx="3" fill="#14151e" stroke="#2b2e40" stroke-width="1" />
  </g>

  <!-- HDMI / Routing Signal Line -->
  <g transform="translate(385, 200)">
    <path d="M0 0 C 25 0, 25 20, 50 20" stroke="#ff7a59" stroke-width="2" stroke-dasharray="4 4" fill="none" />
    <polygon points="46,15 54,20 46,25" fill="#ff7a59" />
    
    <g transform="translate(5, -16)">
      <rect width="40" height="16" rx="4" fill="#14151e" stroke="#ff7a59" stroke-width="0.8" />
      <text x="20" y="11" fill="#ff7a59" font-family="monospace" font-size="7" font-weight="700" text-anchor="middle">HDMI</text>
    </g>
  </g>

  <!-- Display 2: External Conference Room Projector / Wall Screen (Right) -->
  <g transform="translate(450, 75)">
    <!-- Ambient Projector Glow -->
    <rect x="-8" y="-8" width="296" height="266" rx="14" fill="#ff7a59" fill-opacity="0.08" filter="url(#monGlow)" />

    <!-- Projector Screen Frame -->
    <rect width="280" height="250" rx="10" fill="#08090d" stroke="#ff7a59" stroke-width="2" />
    
    <!-- Top Mounting Bar -->
    <rect width="280" height="20" rx="10" fill="#14151e" />
    <rect y="12" width="280" height="8" fill="#14151e" />
    <circle cx="140" cy="10" r="4" fill="#2b2e40" />
    <text x="24" y="14" fill="#ff7a59" font-family="monospace" font-size="7.5" font-weight="700">CONFERENCE ROOM PROJECTOR</text>

    <!-- Clean Audience Presentation Image (Zero Presenter Clutter) -->
    <g transform="translate(14, 30)">
      <!-- 16:9 Canvas -->
      <rect width="252" height="180" rx="4" fill="#12141e" stroke="#202230" stroke-width="1" />
      
      <!-- Keynote Content -->
      <g transform="translate(20, 24)">
        <rect width="140" height="14" rx="2" fill="#ffffff" />
        <rect y="22" width="180" height="8" rx="2" fill="#8d90a5" />

        <!-- Fullscreen Presentation Chart -->
        <g transform="translate(0, 44)">
          <rect width="212" height="66" rx="4" fill="#181a26" stroke="#272b3c" stroke-width="0.8" />
          
          <rect x="20" y="36" width="22" height="22" rx="2" fill="#2b2e40" />
          <rect x="56" y="24" width="22" height="34" rx="2" fill="#2b2e40" />
          <rect x="92" y="14" width="22" height="44" rx="2" fill="#ff7a59" />
          <rect x="128" y="8" width="22" height="50" rx="2" fill="#ff9d85" />
          <rect x="164" y="2" width="22" height="56" rx="2" fill="#ffffff" />
        </g>
      </g>

      <!-- Bottom Minimal Projector Tag -->
      <rect y="156" width="252" height="24" fill="#0a0b10" />
      <text x="14" y="172" fill="#34d399" font-family="monospace" font-size="8">CLEAN AUDIENCE OUTPUT • 60 FPS</text>
    </g>

    <!-- Bottom Mount Feet / Stand -->
    <g transform="translate(14, 220)">
      <text x="126" y="20" fill="#a4a7bc" font-family="sans-serif" font-size="8.5" text-anchor="middle">Audience sees presentation only — zero personal desktop clutter</text>
    </g>
  </g>
</svg>
