<svg viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="End-to-end SwitchCast presentation workflow: Queue sources, open single output, and switch seamlessly">
  <defs>
    <linearGradient id="flowCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="100%" stop-color="#0f1016" />
    </linearGradient>

    <filter id="flowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid -->
  <g opacity="0.12">
    <path d="M50 70 H750 M50 170 H750 M50 270 H750 M50 370 H750 M50 470 H750" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 6" />
    <path d="M120 30 V470 M280 30 V470 M440 30 V470 M600 30 V470 M760 30 V470" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 6" />
  </g>

  <!-- Flow Steps: 3 Sequential Pillars -->

  <!-- STEP 01: QUEUE SOURCES -->
  <g transform="translate(60, 90)">
    <rect width="200" height="300" rx="10" fill="url(#flowCardGrad)" stroke="#2b2f42" stroke-width="1.4" />
    
    <!-- Step Badge -->
    <g transform="translate(16, 20)">
      <circle cx="12" cy="12" r="12" fill="rgba(255, 122, 89, 0.15)" stroke="#ff7a59" stroke-width="1" />
      <text x="12" y="16" fill="#ff7a59" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">01</text>
      <text x="34" y="16" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Add Sources</text>
    </g>

    <text x="16" y="64" fill="#8d90a5" font-family="sans-serif" font-size="8.5">Select windows, slide decks, media, and cameras.</text>

    <!-- Mini Source List Simulation -->
    <g transform="translate(16, 85)">
      <rect width="168" height="40" rx="4" fill="#141622" stroke="#ff7a59" stroke-width="0.8" />
      <text x="10" y="24" font-size="14">📊</text>
      <text x="32" y="20" fill="#ffffff" font-family="sans-serif" font-size="8.5" font-weight="600">Keynote.pptx</text>
      <text x="32" y="32" fill="#ff7a59" font-family="monospace" font-size="7">QUEUED (1)</text>

      <g transform="translate(0, 48)">
        <rect width="168" height="40" rx="4" fill="#12131c" stroke="#232636" stroke-width="0.8" />
        <text x="10" y="24" font-size="14">🌐</text>
        <text x="32" y="20" fill="#ffffff" font-family="sans-serif" font-size="8.5" font-weight="600">Sales Dashboard</text>
        <text x="32" y="32" fill="#34d399" font-family="monospace" font-size="7">QUEUED (2)</text>
      </g>

      <g transform="translate(0, 96)">
        <rect width="168" height="40" rx="4" fill="#12131c" stroke="#232636" stroke-width="0.8" />
        <text x="10" y="24" font-size="14">🎬</text>
        <text x="32" y="20" fill="#ffffff" font-family="sans-serif" font-size="8.5" font-weight="600">Product Video</text>
        <text x="32" y="32" fill="#6d7085" font-family="monospace" font-size="7">QUEUED (3)</text>
      </g>
    </g>

    <!-- Bottom Indicator -->
    <rect x="16" y="248" width="168" height="32" rx="4" fill="#171924" stroke="#2b2f42" stroke-width="0.8" />
    <text x="100" y="268" fill="#a4a7bc" font-family="monospace" font-size="8" text-anchor="middle">Lineup Ready</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(270, 235)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#ff7a59" stroke-width="2" />
    <polygon points="18,-4 26,0 18,4" fill="#ff7a59" />
  </g>

  <!-- STEP 02: LAUNCH OUTPUT & SHARE ONCE -->
  <g transform="translate(300, 90)">
    <rect width="200" height="300" rx="10" fill="url(#flowCardGrad)" stroke="#ff7a59" stroke-width="1.8" filter="url(#flowGlow)" />
    
    <!-- Step Badge -->
    <g transform="translate(16, 20)">
      <circle cx="12" cy="12" r="12" fill="#ff7a59" />
      <text x="12" y="16" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">02</text>
      <text x="34" y="16" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Share Output</text>
    </g>

    <text x="16" y="64" fill="#8d90a5" font-family="sans-serif" font-size="8.5">In Zoom or Teams, share the SwitchCast output window.</text>

    <!-- Mini Output Window Simulation -->
    <g transform="translate(16, 85)">
      <rect width="168" height="142" rx="6" fill="#0c0d12" stroke="#ff7a59" stroke-width="1" />
      <rect width="168" height="18" rx="6" fill="#181a26" />
      <rect y="12" width="168" height="6" fill="#181a26" />
      <circle cx="10" cy="9" r="2.5" fill="#ff7a59" />
      <text x="20" y="12" fill="#ffffff" font-family="sans-serif" font-size="6.5" font-weight="700">SWITCHCAST OUTPUT</text>

      <!-- Active Content -->
      <g transform="translate(12, 28)">
        <rect width="80" height="8" rx="2" fill="#ffffff" />
        <rect y="12" width="120" height="4" rx="1" fill="#7a7d92" />
        <rect y="22" width="144" height="64" rx="3" fill="#141622" stroke="#232636" stroke-width="0.6" />
        
        <!-- Chart Bars inside -->
        <rect x="20" y="58" width="14" height="20" rx="1" fill="#2b2e40" />
        <rect x="42" y="46" width="14" height="32" rx="1" fill="#2b2e40" />
        <rect x="64" y="34" width="14" height="44" rx="1" fill="#ff7a59" />
        <rect x="86" y="24" width="14" height="54" rx="1" fill="#ffffff" />
      </g>

      <!-- Call Bar -->
      <rect y="118" width="168" height="24" fill="#14151f" />
      <circle cx="16" cy="130" r="3" fill="#34d399" />
      <text x="24" y="133" fill="#34d399" font-family="monospace" font-size="7" font-weight="700">SHARED LIVE</text>
    </g>

    <!-- Bottom Indicator -->
    <rect x="16" y="248" width="168" height="32" rx="4" fill="rgba(255, 122, 89, 0.12)" stroke="#ff7a59" stroke-width="0.8" />
    <text x="100" y="268" fill="#ff7a59" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">Share Once Only</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(510, 235)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#ff7a59" stroke-width="2" />
    <polygon points="18,-4 26,0 18,4" fill="#ff7a59" />
  </g>

  <!-- STEP 03: SWITCH & CONTROL -->
  <g transform="translate(540, 90)">
    <rect width="200" height="300" rx="10" fill="url(#flowCardGrad)" stroke="#2b2f42" stroke-width="1.4" />
    
    <!-- Step Badge -->
    <g transform="translate(16, 20)">
      <circle cx="12" cy="12" r="12" fill="rgba(255, 122, 89, 0.15)" stroke="#ff7a59" stroke-width="1" />
      <text x="12" y="16" fill="#ff7a59" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">03</text>
      <text x="34" y="16" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Switch & Control</text>
    </g>

    <text x="16" y="64" fill="#8d90a5" font-family="sans-serif" font-size="8.5">Use the Presenter Dock to jump between queued sources.</text>

    <!-- Mini Dock Simulation -->
    <g transform="translate(16, 85)">
      <rect width="168" height="142" rx="6" fill="#101118" stroke="#2b2e40" stroke-width="1" />
      
      <!-- Dock Pill Container -->
      <g transform="translate(10, 16)">
        <rect width="148" height="60" rx="16" fill="#191b26" stroke="#ff7a59" stroke-width="1" />
        <rect x="8" y="10" width="132" height="18" rx="8" fill="#0f1016" />
        <text x="16" y="22" fill="#ff7a59" font-family="monospace" font-size="6.5" font-weight="700">LIVE:</text>
        <text x="40" y="22" fill="#ffffff" font-family="sans-serif" font-size="7">Dashboard</text>

        <!-- Dock Controls -->
        <g transform="translate(12, 34)">
          <rect width="22" height="18" rx="4" fill="#141520" />
          <text x="11" y="46" font-size="9" text-anchor="middle">⏮</text>
          
          <rect x="28" width="30" height="18" rx="4" fill="#ff7a59" />
          <text x="43" y="46" fill="#ffffff" font-size="9" text-anchor="middle">⏭</text>

          <rect x="64" width="22" height="18" rx="4" fill="#141520" />
          <text x="75" y="46" font-size="9" text-anchor="middle">⏸</text>

          <rect x="92" width="22" height="18" rx="4" fill="#141520" />
          <text x="103" y="46" font-size="9" text-anchor="middle">🕶️</text>
        </g>
      </g>

      <!-- Explanation Snippet -->
      <g transform="translate(12, 88)">
        <text x="0" y="14" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="700">Instant Transition</text>
        <text x="0" y="26" fill="#8d90a5" font-family="sans-serif" font-size="7">Freeze-frame pause and blackout ready anytime.</text>
      </g>
    </g>

    <!-- Bottom Indicator -->
    <rect x="16" y="248" width="168" height="32" rx="4" fill="#171924" stroke="#2b2f42" stroke-width="0.8" />
    <text x="100" y="268" fill="#34d399" font-family="monospace" font-size="8" text-anchor="middle">Uninterrupted Session</text>
  </g>

</svg>
